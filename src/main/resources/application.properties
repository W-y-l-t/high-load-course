server.address=0.0.0.0
server.port=8081
# Bombardier's h2c startup burst produced RST_STREAM and connection failures.
# Serve the API over HTTP/1.1 with persistent connections.
server.http2.enabled=false
# Pending TCP connections before Jetty accepts them; independent of the payment buffer.
server.jetty.accept-queue-size=${HTTP_ACCEPT_QUEUE_SIZE:1024}
# Admission uses the request deadline; a fixed MVC timeout must not truncate longer budgets.
spring.mvc.async.request-timeout=-1ms
spring.main.allow-bean-definition-overriding=true

# MongoDB properties
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=online-shop

# Tiny event sourcing library properties
event.sourcing.auto-scan-enabled=true
event.sourcing.scan-package=ru.quipy
event.sourcing.snapshots-enabled=false
event.sourcing.sagas-enabled=false

# Postgres event store properties
spring.datasource.hikari.jdbc-url=jdbc:postgresql://${POSTGRES_ADDRESS:localhost}:${POSTGRES_PORT:65432}/postgres
spring.datasource.hikari.username=tiny_es
spring.datasource.hikari.password=tiny_es
spring.datasource.hikari.leak-detection-threshold=2000

management.metrics.web.server.request.autotime.percentiles=0.95
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=info,health,prometheus,metrics

payment.service-name=${PAYMENT_SERVICE_NAME}
payment.token=${PAYMENT_TOKEN}
payment.accounts=${PAYMENT_ACCOUNTS:acc-12,acc-20}
payment.hostPort=${PAYMENT_HOST:localhost}:${PAYMENT_PORT:1234}

# Running payment tasks and waiting tasks have independent limits.
payment.executor.threads=${PAYMENT_EXECUTOR_THREADS:16}
payment.queue.capacity=${PAYMENT_QUEUE_CAPACITY:32}
# Fixed processing reserve: account average multiplied by the configured factor.
payment.processing-reserve-factor=${PAYMENT_PROCESSING_RESERVE_FACTOR:2.1}
